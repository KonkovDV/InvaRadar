name: Web map

on:
  push:
    # The feature branch is listed once, so this push publishes the corrected map
    # before the pull request is merged. The following commit drops that name:
    # a site must not keep deploying from a temporary branch.
    branches: [main, cursor/cpu-kernel-and-records-0f32]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# upload-pages-artifact and deploy-pages at v5 in one job race on the artifact
# ("No artifacts named github-pages"). The upload finishes in this job; the deploy
# job starts only after that, which is the layout the Pages actions document.
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
