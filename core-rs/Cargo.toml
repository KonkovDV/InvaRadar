[package]
name = "invaradar_core"
version = "1.2.0"
edition = "2024"
rust-version = "1.89"
description = "Compute core of InvaRadar: AlphaEarth mosaics, multi-scale features, terrain hydrology (Priority-Flood, D8, TWI, HAND), GBDT inference, hotspots, routes, stratified samples"
license = "Apache-2.0"
readme = "../README.md"
keywords = ["remote-sensing", "geospatial", "hydrology", "gbdt", "invasive-species"]
categories = ["science::geo", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
memmap2 = "0.9.12"
rayon = "1.12.0"
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
