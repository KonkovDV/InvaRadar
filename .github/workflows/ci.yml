name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core-rs
    env:
      # the binary is reused by the Python jobs on other runners: no target-cpu=native from .cargo/config.toml
      RUSTFLAGS: "-C target-cpu=x86-64-v3"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core-rs
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: invaradar_core-linux-x86_64
          path: core-rs/target/release/invaradar_core

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    needs: rust
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: invaradar_core-linux-x86_64
          path: core-rs/target/release
      - run: chmod +x core-rs/target/release/invaradar_core
      # v8 and later publish only an immutable tag. @v7 still floats.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      # The image Python refuses system pip. setup-uv makes .venv when activate-environment is set.
      - run: uv pip install -e ".[dev,pro]" -e "./pro"
      - run: uv run ruff check .
      - run: uv run pytest
