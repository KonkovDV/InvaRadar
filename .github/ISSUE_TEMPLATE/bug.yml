name: Ошибка
description: Что-то считается неверно или падает
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Что произошло
      description: Команда, которую запускали, и полный вывод ошибки
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидали
  - type: input
    id: env
    attributes:
      label: Окружение
      placeholder: ОС, версия Python, версия Rust, коммит
