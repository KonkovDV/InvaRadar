[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invaradar-pro"
version = "0.3.0"
description = "ИнваРадар Pro: от сигнала до подтверждённого устранения очага инвазивного растения — право в наряде, доказательство работ, контроль пяти сезонов"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.26", "pyyaml>=6", "pillow>=10"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "httpx>=0.27"]
dev = ["pytest>=8"]

[project.scripts]
invaradar-pro = "invaradar_pro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
invaradar_pro = ["rules/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
