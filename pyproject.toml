[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "invaradar"
version = "1.2.0"
description = "Early detection of invasive plants (Heracleum sosnowskyi, Solidago) from satellite embeddings, drones and citizen photos, with legal treatment rules"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Konkov D. V." }]
keywords = ["invasive species", "remote sensing", "AlphaEarth", "Heracleum sosnowskyi", "Solidago", "geospatial AI", "Rust"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "rasterio>=1.4",
  "pyarrow>=16",
  "matplotlib>=3.9",
  "joblib>=1.4",
]

[project.optional-dependencies]
photo = ["ultralytics>=8.3", "torch>=2.4", "torchvision>=0.19"]
drone = ["torch>=2.4", "timm>=1.0", "pillow>=10"]
dev = ["pytest>=8", "ruff>=0.8", "pre-commit>=3.7"]

[tool.hatch.build.targets.wheel]
packages = ["invaradar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data", "cache", "outputs", "presentation"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "NPY"]
# Compact numeric code: one-line `a = ...; b = ...` statements and short names such as `l` are deliberate.
ignore = ["E701", "E702", "E731", "E741", "B023", "B905"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402", "I001"]
"tests/*.py" = ["E402"]
